<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.89 -5.98 1200.00 400.00" role="img" aria-labelledby="heroTitle heroDesc" width="1200" height="400"><title id="heroTitle">YouTube Digest</title><desc id="heroDesc">YouTube Digest 是一款 Chrome 侧边栏扩展，把任意 YouTube 视频变成学习资源：字幕、双语翻译、AI 概览，以及带时间戳的笔记。</desc><defs><linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1812"/><stop offset="1" stop-color="#14120E"/></linearGradient></defs><!-- background --><rect width="1200" height="400" rx="26" fill="url(#bgGlow)" transform="translate(-0.89 -5.98)"/><!-- faint timeline ruler along the bottom, video-native cue --><!-- ================= title block ================= --><g transform="translate(64 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"><!-- category eyebrow --><g font-size="19" letter-spacing="4" fill="#8A8578"><text x="0" y="0">CHROME 侧边栏扩展</text></g><!-- project name with highlighter bar --><rect x="-8" y="26" width="534" height="64" rx="6" fill="#FFC53D" fill-opacity="0.16" transform="translate(-1.00 0.00) translate(0.00 1.00) translate(62.21 89.99) scale(1.01 1.08) translate(-62.21 -89.99) translate(61.84 87.61) scale(0.99 0.96) translate(-61.84 -87.61) translate(-1.00 0.00) translate(65.42 86.86) scale(1.04 0.99) translate(-65.42 -86.86) translate(-0.78 -1.78) translate(-11.55 0.92) translate(67.43 88.18) scale(0.84 1.01) translate(-67.43 -88.18) translate(2.24 0.68) translate(0.53 4.55) translate(64.59 77.93) scale(1 0.92) translate(-64.59 -77.93) translate(64.71 79.42) scale(1 1.02) translate(-64.71 -79.42) translate(56.00 84.00) scale(0.86 1.07) translate(-56 -84) translate(0.00 1.00) translate(0.00 -1.00) translate(0.00 -1.00) translate(0.00 -1.00) translate(0.00 -1.00) translate(0.00 -1.00)"/><text x="0" y="74" font-size="60" font-weight="800" fill="#F5F1E8" transform="translate(66.00 78.17) scale(0.84 0.84) translate(-66 -78.17) translate(-1.00 0.00) translate(-1.00 0.00) translate(-1.00 0.00) translate(1.00 0.00) translate(1.00 0.00) translate(1.00 0.00) translate(1.00 0.00) translate(1.00 0.00)">YouTube <tspan fill="#FFC53D">Digest</tspan></text><!-- one-line value --><text x="0" y="136" font-size="25" fill="#C9C3B4">把任意视频变成深度学习资源，</text><text x="0" y="170" font-size="25" fill="#C9C3B4">字幕、双语翻译、AI 概览，</text><text x="0" y="204" font-size="25" fill="#C9C3B4">以及带时间戳的笔记，都在一个侧边栏里完成。</text><!-- metadata chips --><g font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><rect x="0" y="240" width="120" height="40" rx="20" fill="none" stroke="#8A8578" stroke-width="1.5"/><text x="60" y="266" text-anchor="middle" fill="#C9C3B4">BYOK</text><rect x="134" y="240" width="150" height="40" rx="20" fill="none" stroke="#8A8578" stroke-width="1.5"/><text x="209" y="266" text-anchor="middle" fill="#C9C3B4">13 种语言</text><rect x="298" y="240" width="130" height="40" rx="20" fill="none" stroke="#8A8578" stroke-width="1.5"/><text x="363" y="266" text-anchor="middle" fill="#C9C3B4">无需构建</text></g></g><!-- ================= side panel card, the product itself ================= --><g transform="translate(700 48)"><rect x="0" y="0" width="448" height="304" rx="18" fill="#1F1C15" stroke="#8A8578" stroke-opacity="0.4" stroke-width="1.5"/><!-- panel header with play button, the project's own icon --><circle cx="40" cy="40" r="16" fill="#FF4D4D"/><path d="M35 31 L49 40 L35 49 Z" fill="#FAF6EE"/><text x="70" y="48" font-size="22" font-weight="700" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Digest</text><!-- mode tabs --><g font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"><rect x="316" y="26" width="56" height="28" rx="14" fill="#FFC53D"/><text x="344" y="45" text-anchor="middle" fill="#14120E" font-weight="600">A</text><text x="392" y="45" text-anchor="middle" fill="#8A8578">あ</text><text x="418" y="45" text-anchor="middle" fill="#8A8578">A/あ</text></g><!-- transcript lines with timestamps: the motif --><g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17"><text x="32" y="106" fill="#FFC53D">04:12</text><text x="96" y="106" fill="#C9C3B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">关键思想比看上去更简单，</text><text x="96" y="132" fill="#C9C3B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">注意力不过是一种加权求和。</text></g><!-- highlighted note row --><rect x="24" y="244" width="400" height="42" rx="8" fill="#FFC53D" fill-opacity="0.12"/><text x="40" y="271" font-size="17" fill="#FFC53D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">✦ 笔记 · 04:12 · 加权求和</text></g></svg>